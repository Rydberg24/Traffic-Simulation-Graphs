<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Simulation - Set 1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .chart-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; height: 400px; width: 100%; }
    </style>
</head>
<body>

    <h1>Akash's Graphs</h1>
    
    <div class="dashboard">
        <div class="chart-container"><canvas id="chartWaitTime"></canvas></div>
        <div class="chart-container"><canvas id="chartMaxQueue"></canvas></div>
        <div class="chart-container"><canvas id="chart2062"></canvas></div>
        <div class="chart-container"><canvas id="chart2058"></canvas></div>
        <div class="chart-container"><canvas id="chart2040"></canvas></div>
        <div class="chart-container"><canvas id="chart959"></canvas></div>
    </div>

    <script>
        const timeLabels = ['8:05', '8:10', '8:15', '8:20', '8:25', '8:30', '8:35', '8:40', '8:45', '8:50', '8:55', '9:00'];
        const colors = { noStrategy: '#0d6efd', police: '#198754', vms: '#dc3545', trafficLights: '#0dcaf0', finalStrategy: '#6f42c1' };

        function createConfig(title, yAxisLabel, datasets) {
            return {
                type: 'line', data: { labels: timeLabels, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { title: { display: true, text: title, font: { size: 16 } }, legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { mode: 'index', intersect: false } },
                    scales: { y: { title: { display: true, text: yAxisLabel, font: { weight: 'bold' } }, beginAtZero: true }, x: { title: { display: true, text: 'Time (PM)' } } },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                }
            };
        }

        // 1. Waiting Time
        new Chart(document.getElementById('chartWaitTime'), createConfig('Centroid: 1086 - Waiting Time in Virtual Queue', 'Waiting Time (sec)', [
            { label: 'Rep No Strategy', data: [0, 0, 275, 290, 290, 288, 292, 285, 295, 290, 292, 288], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Rep Police', data: [0, 0, 270, 278, 276, 265, 258, 272, 290, 292, 294, 272], borderColor: colors.police, backgroundColor: colors.police, tension: 0.1 },
            { label: 'Rep VMS', data: [0, 0, 270, 275, 272, 268, 256, 270, 285, 290, 290, 288], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Rep Traffic Lights', data: [0, 0, 272, 275, 270, 264, 258, 265, 290, 290, 285, 262], borderColor: colors.trafficLights, backgroundColor: colors.trafficLights, tension: 0.1 },
            { label: 'Final Strategy', data: [0, 0, 280, 288, 282, 284, 286, 285, 280, 275, 275, 255], borderColor: colors.finalStrategy, backgroundColor: colors.finalStrategy, tension: 0.1 }
        ]));

        // 2. Max Virtual Queue
        new Chart(document.getElementById('chartMaxQueue'), createConfig('Centroid: 1086 - Max. Virtual Queue', 'Max. Virtual Queue (veh)', [
            { label: 'Rep No Strategy', data: [0, 1200, 1200, 1080, 1020, 950, 860, 800, 720, 650, 560, 480], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Rep Police', data: [0, 1200, 1200, 1020, 880, 720, 560, 400, 330, 310, 280, 260], borderColor: colors.police, backgroundColor: colors.police, tension: 0.1 },
            { label: 'Rep VMS', data: [0, 1200, 1200, 1010, 850, 680, 520, 360, 305, 290, 275, 255], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Rep Traffic Lights', data: [0, 1200, 1200, 1040, 880, 730, 580, 420, 340, 320, 290, 270], borderColor: colors.trafficLights, backgroundColor: colors.trafficLights, tension: 0.1 },
            { label: 'Final Strategy', data: [0, 1200, 1200, 1100, 1020, 900, 800, 720, 620, 570, 490, 390], borderColor: colors.finalStrategy, backgroundColor: colors.finalStrategy, tension: 0.1 }
        ]));

        // 3. Node 2062
        new Chart(document.getElementById('chart2062'), createConfig('Node: 2062 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [78, 103, 120, 125, 135, 156, 162, 140, 153, 170, 118, 124], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Rep Police', data: [76, 94, 135, 156, 166, 212, 138, 126, 108, 96, 94, 125], borderColor: colors.police, backgroundColor: colors.police, tension: 0.1 },
            { label: 'Rep VMS', data: [72, 103, 142, 178, 208, 198, 175, 170, 125, 126, 113, 145], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Rep Traffic Lights', data: [78, 96, 154, 184, 212, 198, 166, 162, 122, 112, 110, 115], borderColor: colors.trafficLights, backgroundColor: colors.trafficLights, tension: 0.1 },
            { label: 'Final Strategy', data: [74, 102, 138, 154, 166, 214, 192, 194, 240, 188, 165, 106], borderColor: colors.finalStrategy, backgroundColor: colors.finalStrategy, tension: 0.1 }
        ]));

        // 4. Node 2058
        new Chart(document.getElementById('chart2058'), createConfig('Node: 2058 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [13, 18, 22, 24, 21, 25, 22, 18, 14, 16, 20, 22], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Rep Police', data: [15, 23, 38, 84, 106, 100, 100, 74, 56, 90, 128, 170], borderColor: colors.police, backgroundColor: colors.police, tension: 0.1 },
            { label: 'Rep VMS', data: [16, 20, 39, 93, 107, 101, 76, 36, 52, 105, 130, 205], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Rep Traffic Lights', data: [14, 21, 33, 82, 106, 99, 73, 37, 46, 75, 118, 172], borderColor: colors.trafficLights, backgroundColor: colors.trafficLights, tension: 0.1 },
            { label: 'Final Strategy', data: [16, 20, 22, 21, 21, 17, 22, 15, 14, 13, 11, 16], borderColor: colors.finalStrategy, backgroundColor: colors.finalStrategy, tension: 0.1 }
        ]));

        // 5. Node 2040
        new Chart(document.getElementById('chart2040'), createConfig('Node: 2040 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [35, 70, 83, 85, 85, 78, 81, 108, 103, 108, 122, 130], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Rep Police', data: [36, 74, 76, 80, 84, 76, 78, 110, 118, 138, 190, 210], borderColor: colors.police, backgroundColor: colors.police, tension: 0.1 },
            { label: 'Rep VMS', data: [34, 76, 78, 82, 78, 80, 80, 116, 122, 145, 183, 205], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Rep Traffic Lights', data: [37, 72, 75, 83, 72, 76, 75, 81, 108, 105, 125, 150], borderColor: colors.trafficLights, backgroundColor: colors.trafficLights, tension: 0.1 },
            { label: 'Final Strategy', data: [33, 73, 77, 86, 76, 91, 79, 88, 111, 109, 108, 94], borderColor: colors.finalStrategy, backgroundColor: colors.finalStrategy, tension: 0.1 }
        ]));

        // 6. Node 959
        new Chart(document.getElementById('chart959'), createConfig('Node: 959 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [45, 68, 95, 96, 95, 75, 62, 44, 44, 38, 36, 32], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Rep Police', data: [42, 60, 80, 89, 70, 80, 75, 78, 82, 86, 108, 20], borderColor: colors.police, backgroundColor: colors.police, tension: 0.1 },
            { label: 'Rep VMS', data: [42, 62, 88, 70, 74, 88, 78, 105, 100, 125, 148, 78], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Rep Traffic Lights', data: [46, 60, 98, 86, 78, 98, 84, 94, 96, 86, 75, 20], borderColor: colors.trafficLights, backgroundColor: colors.trafficLights, tension: 0.1 },
            { label: 'Final Strategy', data: [44, 68, 82, 74, 74, 94, 78, 44, 44, 36, 44, 38], borderColor: colors.finalStrategy, backgroundColor: colors.finalStrategy, tension: 0.1 }
        ]));
    </script>
</body>
</html>
