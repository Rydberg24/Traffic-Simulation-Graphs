<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Simulation - Set 3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .chart-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; height: 400px; width: 100%; }
    </style>
</head>
<body>

    <h1>Umang's Graphs</h1>
    
    <div class="dashboard">
        <div class="chart-container"><canvas id="chartWaitTime"></canvas></div>
        <div class="chart-container"><canvas id="chartMaxQueue"></canvas></div>
        <div class="chart-container"><canvas id="chart2062"></canvas></div>
        <div class="chart-container"><canvas id="chart2058"></canvas></div>
        <div class="chart-container"><canvas id="chart2040"></canvas></div>
        <div class="chart-container"><canvas id="chart959"></canvas></div>
    </div>

    <script>
        const timeLabels = ['8:05', '8:10', '8:15', '8:20', '8:25', '8:30', '8:35', '8:40', '8:45', '8:50', '8:55', '9:00'];
        const colors = { control: '#0d6efd', policy: '#198754', vms: '#dc3545', noStrategy: '#0dcaf0', vms2: '#800080' };

        function createConfig(title, yAxisLabel, datasets) {
            return {
                type: 'line', data: { labels: timeLabels, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { title: { display: true, text: title, font: { size: 16 } }, legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { mode: 'index', intersect: false } },
                    scales: { y: { title: { display: true, text: yAxisLabel, font: { weight: 'bold' } }, beginAtZero: true }, x: { title: { display: true, text: 'Time (PM)' } } },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                }
            };
        }

        // 1. Waiting Time
        new Chart(document.getElementById('chartWaitTime'), createConfig('Centroid: 1086 - Waiting Time in Virtual Queue', 'Waiting Time (sec)', [
            { label: 'Control - Replication', data: [0, 0, 275, 278, 275, 266, 260, 285, 295, 292, 290, 295], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Policy Replication', data: [0, 0, 276, 280, 272, 264, 260, 285, 288, 286, 280, 266], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'VMS - Replication', data: [0, 0, 278, 292, 284, 290, 280, 290, 276, 292, 268, 262], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication - No Strategy', data: [0, 0, 274, 276, 274, 268, 262, 258, 284, 290, 276, 260], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'VMS 2 - Replication', data: [0, 0, 272, 278, 272, 260, 252, 255, 284, 288, 274, 282], borderColor: colors.vms2, backgroundColor: colors.vms2, tension: 0.1 }
        ]));

        // 2. Max Virtual Queue
        new Chart(document.getElementById('chartMaxQueue'), createConfig('Centroid: 1086 - Max. Virtual Queue', 'Max. Virtual Queue (veh)', [
            { label: 'Control - Replication', data: [0, 1200, 1200, 1020, 890, 730, 580, 420, 320, 300, 270, 260], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Policy Replication', data: [0, 1200, 1200, 1010, 850, 700, 570, 410, 330, 310, 280, 240], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'VMS - Replication', data: [0, 1200, 1200, 1060, 1000, 890, 820, 720, 660, 580, 520, 420], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication - No Strategy', data: [0, 1200, 1200, 1050, 850, 750, 580, 420, 320, 290, 270, 240], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'VMS 2 - Replication', data: [0, 1200, 1200, 1020, 870, 700, 540, 360, 290, 260, 240, 210], borderColor: colors.vms2, backgroundColor: colors.vms2, tension: 0.1 }
        ]));

        // 3. Node 2062
        new Chart(document.getElementById('chart2062'), createConfig('Node: 2062 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Control - Replication', data: [74, 100, 138, 162, 162, 164, 160, 154, 120, 110, 152, 152], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Policy Replication', data: [86, 100, 138, 216, 208, 225, 226, 202, 130, 112, 100, 132], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'VMS - Replication', data: [72, 104, 132, 166, 146, 174, 162, 204, 185, 192, 166, 160], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication - No Strategy', data: [78, 116, 114, 162, 162, 164, 160, 154, 148, 122, 112, 152], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'VMS 2 - Replication', data: [74, 96, 142, 190, 188, 245, 198, 160, 130, 124, 100, 132], borderColor: colors.vms2, backgroundColor: colors.vms2, tension: 0.1 }
        ]));

        // 4. Node 2058
        new Chart(document.getElementById('chart2058'), createConfig('Node: 2058 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Control - Replication', data: [15, 22, 40, 30, 22, 21, 32, 42, 78, 110, 155, 155], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Policy Replication', data: [13, 23, 38, 60, 86, 98, 97, 90, 68, 86, 125, 155], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'VMS - Replication', data: [18, 22, 25, 23, 20, 21, 25, 18, 15, 15, 15, 18], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication - No Strategy', data: [18, 25, 40, 30, 22, 21, 32, 42, 78, 110, 195, 195], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'VMS 2 - Replication', data: [15, 22, 38, 85, 96, 94, 101, 68, 44, 72, 103, 160], borderColor: colors.vms2, backgroundColor: colors.vms2, tension: 0.1 }
        ]));

        // 5. Node 2040
        new Chart(document.getElementById('chart2040'), createConfig('Node: 2040 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Control - Replication', data: [33, 72, 74, 80, 84, 94, 90, 92, 98, 134, 142, 168], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Policy Replication', data: [32, 75, 78, 82, 78, 95, 88, 98, 122, 134, 148, 164], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'VMS - Replication', data: [38, 76, 80, 86, 68, 82, 80, 82, 112, 108, 100, 95], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication - No Strategy', data: [32, 75, 78, 92, 88, 92, 90, 106, 144, 160, 168, 200], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'VMS 2 - Replication', data: [36, 70, 72, 82, 84, 94, 96, 98, 126, 135, 142, 168], borderColor: colors.vms2, backgroundColor: colors.vms2, tension: 0.1 }
        ]));

        // 6. Node 959
        new Chart(document.getElementById('chart959'), createConfig('Node: 959 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Control - Replication', data: [45, 65, 88, 68, 60, 80, 55, 22, 32, 58, 42, 30], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Policy Replication', data: [40, 68, 88, 76, 88, 88, 65, 45, 22, 53, 40, 30], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'VMS - Replication', data: [44, 68, 88, 70, 60, 82, 78, 60, 50, 58, 66, 38], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication - No Strategy', data: [48, 78, 110, 98, 115, 100, 102, 102, 340, 330, 430, 245], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'VMS 2 - Replication', data: [42, 65, 90, 68, 60, 75, 55, 22, 32, 58, 140, 68], borderColor: colors.vms2, backgroundColor: colors.vms2, tension: 0.1 }
        ]));
    </script>
</body>
</html>
