<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Simulation - Set 2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .chart-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; height: 400px; width: 100%; }
    </style>
</head>
<body>

    <h1>Sahil's Graphs</h1>
    
    <div class="dashboard">
        <div class="chart-container"><canvas id="chartWaitTime"></canvas></div>
        <div class="chart-container"><canvas id="chartMaxQueue"></canvas></div>
        <div class="chart-container"><canvas id="chart2062"></canvas></div>
        <div class="chart-container"><canvas id="chart2058"></canvas></div>
        <div class="chart-container"><canvas id="chart2040"></canvas></div>
        <div class="chart-container"><canvas id="chart959"></canvas></div>
    </div>

    <script>
        const timeLabels = ['8:05', '8:10', '8:15', '8:20', '8:25', '8:30', '8:35', '8:40', '8:45', '8:50', '8:55', '9:00'];
        const colors = { noStrategy: '#0d6efd', policy: '#198754', vms: '#dc3545', control: '#0dcaf0', studentStrategy: '#800080' };

        function createConfig(title, yAxisLabel, datasets) {
            return {
                type: 'line', data: { labels: timeLabels, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { title: { display: true, text: title, font: { size: 16 } }, legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { mode: 'index', intersect: false } },
                    scales: { y: { title: { display: true, text: yAxisLabel, font: { weight: 'bold' } }, beginAtZero: true }, x: { title: { display: true, text: 'Time (PM)' } } },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                }
            };
        }

        // 1. Waiting Time
        new Chart(document.getElementById('chartWaitTime'), createConfig('Centroid: 1086 - Waiting Time in Virtual Queue', 'Waiting Time (sec)', [
            { label: 'Rep No Strategy', data: [0, 0, 280, 290, 285, 275, 280, 270, 270, 265, 285, 250], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Replication Policy', data: [0, 0, 285, 295, 290, 295, 285, 290, 285, 280, 295, 260], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'Replication VMS', data: [0, 0, 280, 285, 285, 280, 285, 280, 290, 275, 270, 250], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication Control', data: [0, 0, 275, 280, 270, 275, 280, 270, 270, 270, 280, 260], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Replication Student Strategy', data: [0, 0, 275, 280, 270, 275, 265, 250, 295, 270, 295, 295], borderColor: colors.studentStrategy, backgroundColor: colors.studentStrategy, tension: 0.1 }
        ]));

        // 2. Max Virtual Queue
        new Chart(document.getElementById('chartMaxQueue'), createConfig('Centroid: 1086 - Max. Virtual Queue', 'Max. Virtual Queue (veh)', [
            { label: 'Rep No Strategy', data: [0, 1200, 1200, 1040, 940, 860, 780, 700, 620, 520, 440, 360], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Replication Policy', data: [0, 1200, 1200, 1100, 1020, 940, 880, 780, 700, 620, 540, 440], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'Replication VMS', data: [0, 1200, 1200, 1080, 960, 880, 800, 720, 620, 560, 460, 360], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication Control', data: [0, 1200, 1200, 1060, 920, 820, 680, 580, 480, 380, 320, 300], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Replication Student Strategy', data: [0, 1200, 1200, 1020, 880, 710, 580, 440, 320, 300, 270, 260], borderColor: colors.studentStrategy, backgroundColor: colors.studentStrategy, tension: 0.1 }
        ]));

        // 3. Node 2062
        new Chart(document.getElementById('chart2062'), createConfig('Node: 2062 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [34, 46, 44, 48, 72, 94, 104, 88, 66, 100, 94, 92], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Replication Policy', data: [74, 102, 118, 134, 132, 130, 122, 122, 108, 172, 94, 104], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'Replication VMS', data: [80, 104, 136, 178, 200, 192, 156, 158, 196, 138, 146, 82], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication Control', data: [78, 100, 136, 164, 166, 162, 194, 184, 148, 220, 188, 124], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Replication Student Strategy', data: [82, 98, 108, 124, 132, 156, 134, 132, 110, 98, 96, 94], borderColor: colors.studentStrategy, backgroundColor: colors.studentStrategy, tension: 0.1 }
        ]));

        // 4. Node 2058
        new Chart(document.getElementById('chart2058'), createConfig('Node: 2058 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [9, 17, 17, 17, 16, 19, 14, 16, 14, 16.5, 13, 12], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Replication Policy', data: [14.5, 21, 20, 23.5, 20.5, 22, 26.5, 19, 17.5, 19.5, 18, 19.5], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'Replication VMS', data: [15, 21, 23, 22, 20, 24, 27, 25.5, 17.5, 18, 20.5, 18.5], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication Control', data: [17, 21.5, 17, 16, 11.5, 13, 16, 16.5, 26, 23.5, 26.5, 30.5], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Replication Student Strategy', data: [24, 28, 20, 19, 13, 13, 16, 15, 24, 32.5, 23, 24.5], borderColor: colors.studentStrategy, backgroundColor: colors.studentStrategy, tension: 0.1 }
        ]));

        // 5. Node 2040
        new Chart(document.getElementById('chart2040'), createConfig('Node: 2040 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [15, 26, 30, 40, 35, 39, 39, 41, 40, 36, 33, 38], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Replication Policy', data: [38, 73, 76, 85, 83, 81, 84, 91, 118, 103, 106, 122], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'Replication VMS', data: [38, 72, 81, 84, 76, 80, 78, 83, 108, 108, 110, 105], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication Control', data: [37, 74, 90, 107, 107, 102, 116, 108, 107, 142, 158, 159], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Replication Student Strategy', data: [36, 69, 81, 101, 99, 95, 101, 95, 99, 118, 117, 116], borderColor: colors.studentStrategy, backgroundColor: colors.studentStrategy, tension: 0.1 }
        ]));

        // 6. Node 959
        new Chart(document.getElementById('chart959'), createConfig('Node: 959 - Avg Approach Delay', 'Avg Approach Delay (sec)', [
            { label: 'Rep No Strategy', data: [21, 23, 32, 46, 33, 40, 32, 29, 39, 40, 32, 31], borderColor: colors.noStrategy, backgroundColor: colors.noStrategy, tension: 0.1 },
            { label: 'Replication Policy', data: [48, 63, 86, 83, 81, 86, 84, 87, 79, 55, 42, 37], borderColor: colors.policy, backgroundColor: colors.policy, tension: 0.1 },
            { label: 'Replication VMS', data: [45, 67, 91, 78, 76, 92, 79, 58, 39, 47, 36, 32], borderColor: colors.vms, backgroundColor: colors.vms, tension: 0.1 },
            { label: 'Replication Control', data: [49, 57, 71, 78, 63, 91, 63, 68, 88, 55, 41, 59], borderColor: colors.control, backgroundColor: colors.control, tension: 0.1 },
            { label: 'Replication Student Strategy', data: [58, 75, 67, 61, 56, 79, 51, 64, 104, 9, 61, 57], borderColor: colors.studentStrategy, backgroundColor: colors.studentStrategy, tension: 0.1 }
        ]));
    </script>
</body>
</html>
